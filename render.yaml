# Render blueprint: https://render.com/docs/blueprint-spec
# New -> Blueprint -> select this repository. Secrets are prompted on first deploy.
services:
  - type: web
    name: gramsahayak-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: SPEECH_PROVIDER
        value: auto
      # Speech to text for the Virtual Call screen. Set ONE of these (Sarvam is the simplest):
      - key: STT_PROVIDER
        value: auto
      - key: SARVAM_API_KEY
        sync: false
      - key: STT_HTTP_URL
        sync: false
      - key: STT_HTTP_API_KEY
        sync: false
      # How old the offline knowledge pack may be before the app warns the user
      - key: PACK_MAX_AGE_DAYS
        value: "14"
      - key: BEDROCK_MODEL_ID
        sync: false
      - key: ALLOW_SMS_SIMULATION
        value: "true"
